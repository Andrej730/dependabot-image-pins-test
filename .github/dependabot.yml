version: 2
updates:
  # Currently bumping images is unsupported.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # Override Dependabot's default 3-day cooldown.
    cooldown:
      default-days: 0

  # Dockerfiles.
  - package-ecosystem: docker
    directories:
      - /docker/rocky9
      - /docker/rocky10
      - /docker/digest-only
      - /docker/golang-tip
    schedule:
      interval: daily
    # Override Dependabot's default 3-day cooldown.
    cooldown:
      default-days: 0

  # Currently bumping images is unsupported.
  - package-ecosystem: docker
    directory: /.github/workflows
    schedule:
      interval: daily
    # Override Dependabot's default 3-day cooldown.
    cooldown:
      default-days: 0
