name: uses docker://

on:
  workflow_dispatch:
  workflow_call:

jobs:
  uses-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: docker://rockylinux:9@sha256:03303863808e9cd79f0c58c833db3e5f9cde9f2abe16804a267b05dc54af86e4
        with:
          entrypoint: cat
          args: /etc/os-release
      - uses: docker://rockylinux/rockylinux:10@sha256:d24beedc58f79b9e0e9289fedaa4fcbcbe692b1438883a86f177fd7c51053ca8
        with:
          entrypoint: cat
          args: /etc/os-release
      - uses: docker://golang:tip@sha256:3e2adafd72df7604f0954bb721c593e6b7a91303383c5d1acef906e0b1c2e5a0
        with:
          entrypoint: go
          args: version
